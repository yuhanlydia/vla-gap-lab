track: memory_revision
study: icassp_motion_compression
status: ready_to_run
paper_question: does recurrent compression preserve motion available in short visual history?

checkpoint:
  name: mu-vla-k2
  path_default: models/mu-vla-m64-k2
  precision: 4bit

hardware:
  target_gpu_vram_gb: 16
  num_envs: 1
  simulator_step_sync: render_after_step

collection:
  episodes_per_task: 60
  tasks:
    InterceptMedium-VLA-v0:
      start_seed: 4243224242
    InterceptFast-VLA-v0:
      start_seed: 4243324242
  recurrent_memory:
    state: after_policy_update
    tokens: 64
    dtype: float16
  visual_control:
    source: same_mu_vla_projector_current_step
    cameras: 2
    spatial_pool_grid: 2
    tokens_per_step: 8
    dtype: float16
    note: projector features are captured by a forward hook during the same policy call; no extra encoder is used

probe:
  split_seeds: [0, 1, 2, 3, 4]
  train_episodes: 36
  dev_episodes: 12
  test_episodes: 12
  min_step: 2
  token_pca_dim: 32
  sample_pca_dim: 256
  primary_representations:
    - current_visual
    - two_frame_visual_lag1
    - recurrent_memory_full64
  primary_probes: [ridge, mlp]
  targets:
    - position_xy
    - velocity_xy
  ablations:
    - name: memory_token_coverage
      compare: [full64, stride8]
      probe: ridge
    - name: contact_filter
      compare: [pre_contact, all_steps]
      representation: recurrent_memory_full64
      probe: ridge
    - name: visual_temporal_span
      compare_lags: [1, 2]
      representation: two_frame_visual
      probe: ridge

mlp:
  hidden_layer_sizes: [128, 64]
  alpha: 0.0001
  learning_rate_init: 0.001
  max_iter: 500
  early_stopping: true

paper_kill_rule:
  medium_two_frame_velocity_y_r2_min: 0.60
  medium_two_frame_gain_over_current_min: 0.20
  medium_two_frame_gain_over_memory_min: 0.15
  medium_memory_position_r2_min: 0.65
  fast_two_frame_velocity_y_must_exceed_memory: true
  fast_memory_position_r2_min: 0.60
  interpretation: >-
    The compression-loss claim is allowed only if motion is first shown to be
    accessible from two consecutive frozen visual representations, yet is less
    accessible from the recurrent memory that has seen the same history, while
    current spatial state remains decodable from memory. If the two-frame
    control fails, or recurrent memory matches it, stop the claim rather than
    add tasks or tune thresholds.
